<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>POTTERY 브랜드 레퍼런스 보드</title>
<style>
  :root {
    --bg: #f5f1ea;
    --ink: #2b2620;
    --accent: #b25b2a;
    --card: #ffffff;
    --line: #e2dbd0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: var(--bg); color: var(--ink);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .placeholder {
    text-align: center; padding: 48px; background: var(--card);
    border: 1px solid var(--line); border-radius: 16px; max-width: 520px;
  }
  .placeholder h1 { font-size: 28px; margin-bottom: 8px; }
  .placeholder h1 span { color: var(--accent); }
  .placeholder p { color: #6b6257; line-height: 1.7; font-size: 15px; }
  .badge {
    display: inline-block; margin-top: 20px; padding: 6px 14px;
    background: var(--bg); border: 1px solid var(--line);
    border-radius: 999px; font-size: 13px; color: #6b6257;
  }
</style>
</head>
<body>
  <div class="placeholder">
    <h1><span>POTTERY</span> 브랜드 레퍼런스 보드</h1>
    <p>배포 확인용 플레이스홀더 페이지입니다.<br>
    이 페이지가 보이면 깃허브 페이지 세팅이 완료된 것입니다.<br>
    다음 단계에서 브랜드 매트릭스와 상세 페이지가 이 자리에 들어갑니다.</p>
    <div class="badge">setup ok · v0</div>
  </div>
</body>
</html>
