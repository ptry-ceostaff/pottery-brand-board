<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>POTTERY 브랜드 레퍼런스 보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#f4efe7; --card:#fffdf9; --ink:#2b2620; --sub:#6b6257; --line:#e2dbd0;
  --accent:#b25b2a; --dark:#1d1a16;
  --row-modern:#37424d; --row-natmod:#3c4a3f; --row-natural:#41503a; --row-vinnat:#453a30; --row-vintage:#3f3128;
  --tint-modern:#eef1f4; --tint-natmod:#edf1ec; --tint-natural:#eef1ea; --tint-vinnat:#f4eee6; --tint-vintage:#f8f1e4;
  --tag-std:#5b7360; --tag-cas:#b25b2a; --tag-fml:#3d4a63; --tag-tech:#5a6570; --tag-all:#7a6a55;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
.wrap{max-width:1280px;margin:0 auto;padding:36px 28px 80px}
/* ---------- header ---------- */
.hd h1{font-size:30px;letter-spacing:-.5px;font-weight:800}
.hd h1 .logo{font-family:Georgia,"Times New Roman",serif;color:var(--accent);letter-spacing:1px;font-weight:700}
.hd .sub{color:var(--sub);font-size:14px;margin-top:6px}
.legend{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin:18px 0 26px;font-size:12.5px;color:var(--sub)}
.btn-pottery{margin-left:auto;background:var(--dark);color:#f4efe7;border:none;border-radius:999px;padding:9px 18px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-pottery .logo{font-family:Georgia,serif;color:#e8a87c}
.btn-pottery:hover{background:#000}
/* ---------- matrix ---------- */
.matrix{display:grid;grid-template-columns:110px repeat(7,1fr);gap:0;border-radius:14px;overflow:hidden;box-shadow:0 2px 14px rgba(43,38,32,.08);font-size:13px}
.mx-corner{background:var(--dark);color:#cfc7ba;padding:14px 12px;font-size:12px;line-height:1.5}
.mx-corner b{color:#f4efe7;font-size:13px}
.mx-col{background:var(--dark);color:#f4efe7;padding:13px 8px;text-align:center;font-weight:700;font-size:13.5px}
.mx-col.bridge{background:#463c30;color:#cfc7ba;font-weight:500;font-size:12px}
.mx-row{color:#f4efe7;padding:12px 10px;font-weight:700;display:flex;align-items:center;font-size:13px;line-height:1.4}
.mx-cell{background:var(--card);border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 9px;min-height:64px}
.mx-cell.bridge{filter:brightness(.972)}
.chip{display:block;width:100%;text-align:left;background:none;border:none;font-family:inherit;font-size:13px;color:var(--ink);padding:2.5px 4px;border-radius:6px;cursor:pointer;line-height:1.45}
.chip:hover{background:rgba(178,91,42,.09)}
.chip.has{font-weight:700;color:#1d1a16}
.chip.has::after{content:"→";color:var(--accent);font-size:11px;margin-left:5px}
.chip.todo{color:#6b6257}
/* 주요 브랜드 */
.chip.key{background:rgba(178,91,42,.08);box-shadow:inset 2px 0 0 var(--accent);padding-left:8px}
.chip.key:hover{background:rgba(178,91,42,.16)}
.legend .keybox{display:inline-block;width:11px;height:11px;border-radius:2px;background:rgba(178,91,42,.14);box-shadow:inset 2px 0 0 var(--accent);margin-right:5px;vertical-align:-1px}
.btn-key{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12.5px;color:var(--sub);cursor:pointer;font-family:inherit}
.btn-key:hover{border-color:var(--accent);color:var(--accent)}
.btn-key.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.matrix.only-key .chip:not(.key){display:none}
.matrix.only-key .mx-cell{min-height:44px}
/* row tint per band */
.r-modern .mx-cell{background:var(--tint-modern)} .r-natmod .mx-cell{background:var(--tint-natmod)}
.r-natural .mx-cell{background:var(--tint-natural)} .r-vinnat .mx-cell{background:var(--tint-vinnat)}
.r-vintage .mx-cell{background:var(--tint-vintage)}
.foot{margin-top:14px;color:var(--sub);font-size:12px}
/* ---------- detail ---------- */
.detail{max-width:880px;margin:0 auto}
.back{background:none;border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:13px;color:var(--sub);cursor:pointer;font-family:inherit;margin-bottom:22px}
.back:hover{border-color:var(--accent);color:var(--accent)}
.d-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:34px 38px;box-shadow:0 2px 14px rgba(43,38,32,.06)}
.d-head .cellpos{display:inline-block;font-size:12px;font-weight:700;color:#5b7360;border:1.5px solid #5b7360;border-radius:999px;padding:3px 12px;margin-bottom:12px}
.d-head h2{font-size:28px;letter-spacing:-.5px}
.d-head .en{color:var(--sub);font-size:14px;margin-left:8px;font-weight:400}
.d-head .oneline{margin-top:12px;font-size:16.5px;font-weight:600;line-height:1.65;color:#3a332b;border-left:3px solid var(--accent);padding-left:14px}
.sec{margin-top:34px}
.sec>h3{font-size:15px;font-weight:800;color:var(--accent);letter-spacing:.3px;margin-bottom:12px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.sec p{font-size:14.5px;margin:8px 0}
.sec ul{padding-left:19px;font-size:14.5px}
.sec li{margin:5px 0}
table.qf{width:100%;border-collapse:collapse;font-size:13.5px}
table.qf th{width:120px;text-align:left;color:var(--sub);font-weight:600;padding:7px 10px 7px 0;vertical-align:top;border-bottom:1px solid #efe9df}
table.qf td{padding:7px 0;border-bottom:1px solid #efe9df}
.tl{position:relative;padding-left:18px}
.tl::before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .ev{position:relative;margin:9px 0;font-size:14px}
.tl .ev::before{content:"";position:absolute;left:-17.5px;top:7px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.tl .y{font-weight:800;margin-right:8px}
.prod h4{font-size:14px;margin:15px 0 4px;font-weight:700}
.prod h4:first-child{margin-top:0}
.warnbox{background:#fbf4ec;border:1px solid #ecd9c6;border-radius:10px;padding:13px 16px;font-size:13.5px;margin-top:10px}
/* ---- v4.1: 브랜드 개요 · 선언문 ---- */
.ovw{font-size:14.5px;line-height:1.85;margin:2px 0 0}
.ovw b{color:#1d1a16}
.manifesto{margin-top:16px;padding:16px 20px;background:#fffefb;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:0 10px 10px 0}
.manifesto .h{display:block;font-size:11.5px;font-weight:800;color:var(--accent);letter-spacing:.6px;margin-bottom:8px}
.manifesto blockquote{margin:0;font-size:13.5px;line-height:1.85;color:#4a423a}
.manifesto blockquote .en{display:block;margin-top:8px;font-size:12.5px;color:#8a8075;font-style:italic;line-height:1.7}
.manifesto .src{display:block;margin-top:9px;font-size:12px;color:var(--sub)}
.manifesto.none{border-left-color:#ccc3b6;background:#faf8f4}
.manifesto.none .h{color:#8a8075}
/* ---- v4: 상품 라인업 × 포터리 대응 비교표 ---- */
.cmpwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:10px 0}
.cmp{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
.cmp th{background:var(--dark);color:#f4efe7;font-weight:700;text-align:left;padding:10px 12px;font-size:12.5px;white-space:nowrap}
.cmp td{border-bottom:1px solid var(--line);padding:10px 12px;vertical-align:top;line-height:1.5}
.cmp tr:last-child td{border-bottom:none}
.cmp .sig-t{font-weight:800;color:#1d1a16;cursor:pointer;border-bottom:1px dotted var(--accent)}
.cmp .sig-t::after{content:"▾";color:var(--accent);font-size:10px;margin-left:4px;display:inline-block;transition:transform .18s}
.cmp tr.expanded .sig-t::after{transform:rotate(180deg)}
.cmp tr.sig-row{display:none}
.cmp tr.sig-row.open{display:table-row}
.cmp tr.sig-row td{background:#fbf7f0;font-size:13px;color:#4a423a}
.cmp tr.sig-row .voice{color:#7a5b3a;display:block;margin-top:5px}
.cmp .gap{color:var(--accent);font-weight:700}
.xmark{color:#c0392b;font-weight:800;font-size:17px;line-height:1}
.cmp .none{color:#a99e90}
.cmp caption{caption-side:bottom;text-align:left;font-size:12.5px;color:var(--sub);padding-top:8px;line-height:1.6}
/* ---- v4.6: 상품 구성 도식 ---- */
.diag{margin:14px 0}
.diag .cap{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.3px;margin-bottom:7px}
/* 네이밍 공식 */
.formula{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:14px 16px;background:var(--dark);border-radius:12px}
.formula .tok{background:#fffefb;color:var(--ink);border-radius:8px;padding:7px 13px;font-size:13.5px;font-weight:700;line-height:1.35;text-align:center}
.formula .tok small{display:block;font-size:11px;font-weight:500;color:var(--sub);margin-top:2px}
.formula .op{color:#cfc7ba;font-size:13px;font-weight:700}
.formula .tok.a{box-shadow:inset 0 -3px 0 var(--accent)}
.formula .tok.b{box-shadow:inset 0 -3px 0 #5b7360}
/* 2축 격자 */
.gridwrap{overflow-x:auto;margin-top:4px}
.mgrid{border-collapse:collapse;font-size:12px;min-width:520px}
.mgrid th{background:#f0eadf;color:#4a423a;font-weight:700;padding:8px 9px;border:1px solid var(--line);text-align:center;font-size:11.5px;line-height:1.35}
.mgrid th.rowh{background:var(--dark);color:#f4efe7;text-align:left;white-space:nowrap}
.mgrid th.corner{background:transparent;border:none}
.mgrid td{border:1px solid var(--line);text-align:center;padding:8px 9px;background:var(--card);color:#c7bfb4;font-size:13px}
.mgrid td.on{background:rgba(178,91,42,.13);color:var(--accent);font-weight:800}
.mgrid .note{font-size:11.5px;color:var(--sub);text-align:left;background:transparent;border:none}
/* 분류축 레인 */
.lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px;margin-top:4px}
.lane{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--card)}
.lane>.h{background:#f0eadf;padding:8px 11px;font-size:12.5px;font-weight:800;color:#4a423a;display:flex;gap:6px;align-items:baseline}
.lane>.h .n{color:var(--accent);font-size:13px}
.lane.star>.h{background:var(--accent);color:#fff}
.lane.star>.h .n{color:#ffe6d5}
.lane .b{padding:10px 11px;font-size:12px;line-height:1.65;color:#4a423a}
.lane .b .step{display:block;padding-left:11px;position:relative;margin-bottom:3px}
.lane .b .step::before{content:"→";position:absolute;left:0;color:var(--accent);font-size:10px;top:2px}
.lane .b .step:first-child::before{content:"·"}
.lane .b em{font-style:normal;color:var(--sub)}
.lane .tag2{display:inline-block;margin-top:7px;font-size:11px;background:#f5f1ea;border-radius:999px;padding:2px 8px;color:var(--sub)}
/* ---- v4.5: 분석 → 제안 점프 ---- */
.jump{display:inline-block;margin-top:6px;background:none;border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:3px 11px;font-size:11.5px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap;line-height:1.5}
.jump:hover{background:var(--accent);color:#fff}
.verdict{font-weight:700;display:block;margin-bottom:2px}
.verdict.ok{color:#5b7360}
.verdict.gapv{color:var(--accent)}
.verdict.na{color:#8a8075}
.prop.flash{animation:flash 1.5s ease}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(178,91,42,.55)}40%{box-shadow:0 0 0 7px rgba(178,91,42,.12)}100%{box-shadow:0 0 0 0 rgba(178,91,42,0)}}
.backtop{display:inline-block;margin-top:4px;background:none;border:none;color:var(--sub);font-family:inherit;font-size:12px;cursor:pointer;padding:0;text-decoration:underline}
.backtop:hover{color:var(--accent)}
/* ---- v4.3: 제안 카드 ---- */
.props{display:grid;gap:14px;margin-top:14px}
.prop{border:1px solid var(--line);border-radius:12px;background:#fffefb;overflow:hidden}
.prop>.hd{background:var(--dark);color:#f4efe7;padding:11px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.prop>.hd .t{font-size:14.5px;font-weight:800}
.prop>.hd .rank{font-size:11.5px;font-weight:700;background:var(--accent);color:#fff;border-radius:999px;padding:2px 9px}
.prop>.hd .coord{font-size:11.5px;color:#cfc7ba;margin-left:auto}
.prop .bd{padding:14px 16px}
.prop dl{display:grid;grid-template-columns:96px 1fr;gap:6px 12px;margin:0 0 12px;font-size:13px}
.prop dt{color:var(--sub);font-weight:700}
.prop dd{margin:0;line-height:1.6}
.prop dd a{color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(178,91,42,.35)}
.prop dd a:hover{border-bottom-style:solid;color:#8c451f}
.prop .take{margin:0;padding-left:19px;font-size:13.5px;line-height:1.7}
.prop .take li{margin-bottom:7px}
.prop .take li:last-child{margin-bottom:0}
.prop .foot{margin-top:12px;padding-top:11px;border-top:1px dashed var(--line);font-size:13px;color:#4a423a;line-height:1.7}
.prop .foot b{color:var(--accent)}
.prop.na>.hd{background:#6f665b}
.prop.na>.hd .rank{background:#9c9287}
@media(max-width:640px){ .prop dl{grid-template-columns:1fr;gap:2px 0} .prop dt{margin-top:6px} }
/* ---- v4: 5축 안의 포터리 적용 블록 ---- */
.pot-apply{margin-top:11px;padding:11px 13px;background:#fbf4ec;border-left:3px solid var(--accent);border-radius:0 8px 8px 0}
.pot-apply .h{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.3px;display:block;margin-bottom:5px}
.pot-apply p{font-size:13.5px;margin:0;line-height:1.65}
.pot-apply .tags{margin-bottom:5px}
.sig{border:1px solid var(--line);border-radius:12px;padding:15px 18px;margin:10px 0;background:#fffefb}
.sig b.t{font-size:14.5px}
.sig .price{color:var(--sub);font-weight:400;font-size:13px}
.sig p{font-size:13.5px;margin:5px 0 0}
.sig .voice{color:#7a5b3a;font-size:13px;margin-top:6px}
/* strengths accordion */
.acc{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.acc-item+.acc-item{border-top:1px solid var(--line)}
.acc-btn{display:grid;grid-template-columns:130px 90px 1fr 22px;gap:10px;align-items:center;width:100%;background:#fffefb;border:none;font-family:inherit;text-align:left;padding:13px 16px;font-size:13.5px;cursor:pointer}
.acc-btn:hover{background:#faf5ec}
.acc-btn .ax{font-weight:800}
.acc-btn .dots{color:var(--accent);letter-spacing:2px;font-size:12px}
.acc-btn .sum{color:var(--sub)}
.acc-btn .arr{color:var(--accent);transition:transform .18s;justify-self:end}
.acc-item.open .acc-btn .arr{transform:rotate(90deg)}
.acc-body{display:none;padding:6px 18px 16px;background:#fbf8f1;font-size:13.5px}
.acc-item.open .acc-body{display:block}
.acc-body ul{padding-left:18px}
.acc-body li{margin:6px 0}
.hint{font-size:12px;color:var(--sub);margin-bottom:8px}
/* reference points */
.ref{border-left:3px solid var(--line);padding:2px 0 2px 14px;margin:13px 0}
.ref .tags{margin-bottom:3px}
.tag{display:inline-block;font-size:11px;font-weight:700;color:#fff;border-radius:999px;padding:2px 10px;margin-right:5px}
.tag.std{background:var(--tag-std)} .tag.cas{background:var(--tag-cas)} .tag.fml{background:var(--tag-fml)} .tag.tech{background:var(--tag-tech)} .tag.all{background:var(--tag-all)}
.ref b{font-size:14.5px}
.ref p{font-size:13.5px;margin-top:3px}
.srcs{font-size:12.5px;color:var(--sub);line-height:2}
.srcs a{color:#7a5b3a}
.imglinks a{display:inline-block;margin:3px 10px 3px 0;font-size:13.5px;color:#7a5b3a}
.todo-note{background:#fffdf9;border:1px dashed var(--line);border-radius:14px;padding:40px;text-align:center;color:var(--sub)}
@media (max-width:900px){
  .matrix{font-size:11.5px;grid-template-columns:78px repeat(7,1fr)}
  .chip{font-size:11.5px}
  .d-card{padding:24px 20px}
  .acc-btn{grid-template-columns:96px 70px 1fr 18px;font-size:12.5px}
}
</style>
</head>
<body>
<div class="wrap">
  <!-- ============ 보드(매트릭스) 뷰 ============ -->
  <div id="view-board">
    <div class="hd">
      <h1><span class="logo">POTTERY</span> 브랜드 분류 매트릭스</h1>
      <div class="sub">감성(세로) × 격식·기능(가로) — 브랜드를 클릭하면 상세 분석 페이지가 열립니다</div>
    </div>
    <div class="legend">
      <span><span class="keybox"></span>주요 브랜드</span>
      <span><b style="color:var(--ink)">굵은 글씨→</b> 상세 분석 완료</span>
      <button class="btn-key" id="btn-key" onclick="toggleKey()">주요 브랜드만 보기</button>
      <button class="btn-pottery" onclick="openBrand('pottery')"><span class="logo">POTTERY</span> 자체 분석 보기 →</button>
    </div>
    <div class="matrix" id="matrix"></div>
    <div class="foot">감성 온도: Modern(쿨) → Vintage(웜) · 격식: Formal → Casual · 기능: → Tech/Sports · 브릿지 칸(↔)은 경계·전이 영역</div>
  </div>

  <!-- ============ 상세 뷰 ============ -->
  <div id="view-detail" style="display:none">
    <div class="detail">
      <button class="back" onclick="goBoard()">← 매트릭스로 돌아가기</button>
      <div id="detail-body"></div>
    </div>
  </div>
</div>

<script>
/* ===================== 매트릭스 데이터 ===================== */
const COLS = [
  {k:'formal', t:'Formal'}, {k:'f-s', t:'Formal↔Standard', bridge:true},
  {k:'standard', t:'Standard'}, {k:'s-c', t:'Standard↔Casual', bridge:true},
  {k:'casual', t:'Casual'}, {k:'c-t', t:'Casual↔Tech', bridge:true},
  {k:'tech', t:'Tech / Sports'}
];
const ROWS = [
  {k:'modern', t:'Modern', cls:'r-modern', color:'var(--row-modern)'},
  {k:'natmod', t:'Natural↔Modern', cls:'r-natmod', color:'var(--row-natmod)'},
  {k:'natural', t:'Natural', cls:'r-natural', color:'var(--row-natural)'},
  {k:'vinnat', t:'Vintage↔Natural', cls:'r-vinnat', color:'var(--row-vinnat)'},
  {k:'vintage', t:'Vintage', cls:'r-vintage', color:'var(--row-vintage)'}
];
/* n=이름, id=상세 페이지 보유 시, key=주요 브랜드 */
const CELLS = {
  'modern|formal':[{n:'Theory',id:'theory',key:1},{n:'Jil Sander',id:'jil-sander'}],
  'modern|f-s':[{n:'The Row',id:'the-row',key:1}],
  'modern|standard':[{n:'Studio Nicholson',id:'studio-nicholson'},{n:'COS',id:'cos',key:1}],
  'modern|s-c':[{n:'YOKE',id:'yoke'},{n:'Lemaire',id:'lemaire',key:1}],
  'modern|casual':[{n:'Comoli',id:'comoli'},{n:'Kith',id:'kith'}],
  'modern|c-t':[{n:"Arc'teryx",id:'arcteryx',key:1}],
  'modern|tech':[{n:'Goldwin',id:'goldwin',key:1},{n:'Portal',id:'portal',key:1}],
  'natmod|standard':[{n:'Our Legacy',id:'our-legacy'},{n:'Auralee',id:'auralee'},{n:'ATON',id:'aton'}],
  'natural|formal':[{n:'Loro Piana',id:'loro-piana',key:1},{n:'Brunello Cucinelli',id:'brunello-cucinelli'}],
  'natural|f-s':[{n:'Margaret Howell',id:'margaret-howell'}],
  'natural|standard':[{n:'James Perse',id:'james-perse',key:1},{n:'Sunspel',id:'sunspel'}],
  'natural|s-c':[{n:'Kaptain Sunshine',id:'kaptain-sunshine',key:1},{n:'Danton',id:'danton'}],

/* ===================== 렌더링 ===================== */
function buildMatrix(){
  const m = document.getElementById('matrix');
  let h = '<div class="mx-corner"><b>감성 ↘ 격식</b><br>EMOTION / FORMALITY</div>';
  COLS.forEach(c=> h += '<div class="mx-col'+(c.bridge?' bridge':'')+'">'+c.t+'</div>');
  ROWS.forEach(r=>{
    h += '<div class="mx-row '+r.cls+'" style="background:'+r.color+'">'+r.t.replace('↔','↔<br>')+'</div>';
    COLS.forEach(c=>{
      const key = r.k+'|'+c.k;
      const brands = CELLS[key]||[];
      const cls = 'mx-cell '+r.cls+(c.bridge?' bridge':'')+(HOME_CELLS.includes(key)?' home':'');
      let inner = brands.map(b=>{
        const has = !!b.id;
        return '<button class="chip '+(has?'has':'todo')+(b.key?' key':'')+'" onclick="'+(has?("openBrand('"+b.id+"')"):("todoBrand('"+b.n.replace(/'/g,"\\'")+"')"))+'">'+b.n+'</button>';
      }).join('');
      h += '<div class="'+cls+'">'+inner+'</div>';
    });
  });
  m.innerHTML = h;
}
function toggleKey(){
  const m = document.getElementById('matrix');
  const b = document.getElementById('btn-key');
  const on = m.classList.toggle('only-key');
  b.classList.toggle('on', on);
  b.textContent = on ? '전체 브랜드 보기' : '주요 브랜드만 보기';
}
function openBrand(id){
  const d = DETAILS[id];
  const body = document.getElementById('detail-body');
  body.innerHTML = d ? d : '<div class="todo-note">이 브랜드의 상세 분석은 준비 중입니다.</div>';
  document.getElementById('view-board').style.display='none';
  document.getElementById('view-detail').style.display='block';
  location.hash = 'brand='+id;
  window.scrollTo(0,0);
}
function todoBrand(name){
  const body = document.getElementById('detail-body');

/* 강점 분석 아코디언 */
document.addEventListener('click', e=>{
  const btn = e.target.closest('.acc-btn');
  if(btn){ btn.parentElement.classList.toggle('open'); return; }
  /* 분석표 → 제안 카드 점프 */
  const jp = e.target.closest('.jump');
  if(jp){
    const el = document.getElementById(jp.dataset.jump);
    if(el){
      el.scrollIntoView({behavior:'smooth', block:'center'});
      el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
    }
    return;
  }
  /* 제안 카드 → 분석표로 복귀 */
  const bt = e.target.closest('.backtop');
  if(bt){
    const el = document.getElementById(bt.dataset.back);
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
    return;
  }
  /* 비교표의 시그니처 상품 클릭 → 다음 행(설명) 토글 */
  const sig = e.target.closest('.sig-t');
  if(sig){
    const row = sig.closest('tr');
    const next = row.nextElementSibling;
    if(next && next.classList.contains('sig-row')){
      const open = next.classList.toggle('open');
      row.classList.toggle('expanded', open);
    }
  }
});

}

      <li>씨아일랜드 코튼 캐시미어 원단은 <b>개발에 3년</b>이 걸림 — 신소재 하나에 3년을 쓰는 개발 속도</li>
      <li>2025~26년 파리·도쿄 매장 오픈과 미국 비스포크 서비스 시작 — 165년 만에 본격 글로벌 리테일 확장</li>
    </ul>
  </div>

  <div class="sec">
    <h3>③ 타임라인</h3>
    <div class="tl">
      <div class="ev"><span class="y">1860</span>토머스 힐, 노팅엄에서 창업 — 캐시미어·실크·메리노·씨아일랜드 코튼으로 최고급 속옷 제작</div>
      <div class="ev"><span class="y">1930s</span>대공황으로 수출 붕괴 → 씨아일랜드 코튼 럭셔리 속옷의 내수로 생존. 1935년 '선스펠' 라인명 확립</div>
      <div class="ev"><span class="y">1937</span>롱이튼 공장으로 이전 — 현재까지 같은 공장에서 핵심 상품 생산</div>
      <div class="ev"><span class="y">1947~</span>영국 최초로 복서 쇼츠 도입 · 이후 티셔츠를 겉옷 카테고리로 확립</div>
      <div class="ev"><span class="y">2006</span>'카지노 로얄' 제임스 본드 착용 — 리비에라 폴로가 글로벌 아이콘화</div>
      <div class="ev"><span class="y">2025~26</span>파리 부티크, 도쿄 플래그십, 미국 서부 확장 · 한국 파트너십 모색</div>
    </div>
    <p style="color:var(--sub);font-size:13px">확장 패턴 요약: <b>165년 동안 카테고리를 거의 늘리지 않음</b>. 속옷 → 티셔츠 → 폴로/니트 정도가 전부. 제임스 펄스·로로피아나가 '확장'의 교과서라면, 선스펠은 <b>'확장하지 않고 버티는 법'</b>의 교과서.</p>
  </div>

  <div class="sec prod">
    <h3>④ 상품 구성 — 의류 · 잡화 · 라이프스타일</h3>
    <h4>티셔츠 — 브랜드의 원점</h4>
    <p>클래식 티셔츠(£75~)와 씨아일랜드 코튼 티셔츠(£110~)의 2단 구조. 차이는 오직 <b>원사 등급</b>. 실루엣과 패턴은 수십 년째 거의 동일 — "작년 것과 올해 것이 같다"가 결함이 아니라 판매 논리.</p>
    <h4>복서 쇼츠 · 언더웨어</h4>
    <p>브랜드의 뿌리이자 지금도 스테디셀러. 티셔츠 고객이 자연스럽게 넘어오는 <b>재구매 주기가 가장 짧은 카테고리</b> — 언더웨어를 '싸구려 부가상품'이 아니라 정가 프리미엄 상품으로 유지한 드문 사례.</p>
    <h4>리비에라 폴로 ★</h4>
    <p>메시가 아닌 <b>부드러운 니트 코튼</b>(수피마)으로 짠 폴로. 007 착장으로 아이콘이 된 단일 상품이 브랜드 인지의 절반을 담당. 단일 상품이 브랜드를 대표할 때의 힘을 보여줌.</p>
    <h4>니트 · 로브 · 아우터</h4>
    <p>메리노·캐시미어 니트, 타월링 로브, 최근 울 블레이저까지 조심스럽게 확장. 다만 <b>전체 SKU 수는 동종 브랜드 대비 현저히 적음</b> — 의도적 절제.</p>
    <h4>잡화</h4>
    <p>⚠️ <b>거의 없음.</b> 양말·소품 수준. 잡화 확장의 레퍼런스로는 부적합하며, 오히려 "잡화 없이도 브랜드가 성립하는가"의 반례로 볼 것 — 성립은 하지만 <b>객단가와 확장성의 천장이 낮다</b>.</p>
    <h4>라이프스타일</h4>
    <p>없음. 공간·리빙으로 나가지 않고 <b>옷 안에 머무는 전략</b>. 대신 롱이튼 공장 자체를 브랜드 콘텐츠(공장 투어·제조 스토리)로 활용.</p>
  </div>

  <div class="sec">
    <h3>⑤ 시그니처 & 소비자 반응</h3>
    <div class="sig"><b class="t">클래식 / 씨아일랜드 코튼 티셔츠</b> <span class="price">£75~110</span>
      <p>인기 포인트: 목 리브가 늘어나지 않는 마감, 세탁 후에도 유지되는 형태, 비치지 않는 적당한 두께.</p>
      <p class="voice">소비자 반응 — <b>"몇 년을 입어도 목이 안 늘어난다"</b>는 내구성 호평이 압도적. 제임스 펄스가 "구멍이 난다"로 비판받는 지점에서 정반대 평판을 가짐. 반면 <b>"핏이 보수적이다", "가격 대비 재미가 없다"</b>는 반응도 많음 — 감탄이 아니라 신뢰를 사는 브랜드.</p>
    </div>
    <div class="sig"><b class="t">리비에라 폴로</b> <span class="price">£145~</span>
      <p>007 착용 이후 "본드 폴로"로 검색되는 상품. <b>영화 스타일링 한 번의 자산 수명이 20년</b>이라는 것을 보여줌.</p>
    </div>
    <div class="sig"><b class="t">복서 쇼츠</b> <span class="price">£30~55</span>
      <p>선물 수요와 재구매가 동시에 발생하는 진입 카테고리. "선스펠은 속옷부터 시작한다"는 구매 경로가 형성돼 있음.</p>
    </div>

  <div class="sec">
    <h3>⑦ 포터리 레퍼런스 포인트</h3>
    <div class="ref"><div class="tags"><span class="tag std">스탠다드</span></div>
      <b>패턴을 고정해서 '사이즈 기억'을 자산으로 만들기</b>
      <p>선스펠은 수십 년간 패턴을 바꾸지 않아 고객이 자기 사이즈를 외운 채 재주문함. 포터리도 <b>대표 셔츠·티셔츠의 패턴을 시즌마다 손대지 않고 고정 선언</b>하면 온라인 재구매율과 반품률 양쪽에서 이득. 자사몰 비중이 높은 포터리에 특히 유효.</p></div>
    <div class="ref"><div class="tags"><span class="tag all">공통</span></div>
      <b>공장을 콘텐츠로 — 만들어낸 서사가 아니라 실재하는 장소</b>
      <p>롱이튼 공장 저널처럼, 포터리도 협력 봉제공장·원단 산지를 정기 콘텐츠로 발행하면 '정돈된 기본'이라는 주장에 물리적 근거가 생김. 브랜드 필름보다 <b>공정·사람·기계의 기록</b>이 신뢰를 만듦.</p></div>
    <div class="ref"><div class="tags"><span class="tag std">스탠다드</span><span class="tag cas">캐주얼</span></div>
      <b>언더웨어/이너를 정가 프리미엄 카테고리로 운영</b>
      <p>선스펠은 재구매 주기가 가장 짧은 속옷을 할인 상품이 아니라 정가 상품으로 유지해 <b>고객 접촉 빈도</b>를 확보함. 포터리도 이너·양말류를 '끼워파는 것'이 아니라 독립된 품질 서사를 가진 라인으로 두면 재방문 주기가 짧아짐.</p></div>
    <div class="ref"><div class="tags"><span class="tag all">공통</span></div>
      <b>VMD — 상품 수가 적을 때는 여백과 컬러 그러데이션</b>
      <p>SKU가 적은 존(예: 티셔츠·이너)은 채우려 하지 말고 <b>같은 아이템의 컬러를 그러데이션으로 쌓아</b> 하나의 색면으로 보이게 하는 것이 정석. 빈약해 보이는 대신 '선택지가 정돈되어 있다'로 읽힘.</p></div>
    <div class="ref"><div class="tags"><span class="tag all">공통</span></div>
      <b>단일 상품 하나에 브랜드를 걸어보기</b>
      <p>리비에라 폴로 하나가 20년째 브랜드 인지를 담당함. 포터리도 <b>'이 브랜드는 이 옷'이라고 외부에서 지목되는 단일 상품</b>이 있는지 점검할 필요. 없다면 그것부터 만드는 게 라인 확장보다 우선.</p></div>
    <div class="warnbox"><b>⚠️ 주의점 (반면교사)</b><br>
    ① <b>절제는 성장의 천장이 됨</b> — 잡화·라이프스타일이 없어 객단가와 평당 매출 상단이 막힘. 포터리가 잡화를 보강하는 방향은 옳으며, 선스펠은 그 반대 사례로 읽을 것.<br>
    ② <b>"재미없다"는 평판의 비용</b> — 변하지 않는 것이 신뢰를 주지만 신규 유입은 느려짐. 기본을 지키되 유입 장치(협업·단일 히트상품·공간)는 따로 설계해야 함.<br>
    ③ 도매 의존은 저비용 확장이지만 <b>브랜드 경험 통제력을 잃음</b> — 포터리의 자사몰·직영 중심 구조가 오히려 우위.</div>
  </div>

  <div class="sec">
    <h3>② 특이사항</h3>
    <ul>
      <li><b>같은 회사 안에서 가격이 10배 차이 나는 라인이 공존</b> — 폴로(대중) / RRL(고증) / 퍼플라벨(럭셔리)이 각기 다른 가격·유통·할인 정책으로 운영됨. 그룹 라벨 아키텍처의 대표 사례</li>
      <li><b>브랜드가 아니라 '라인'이 럭셔리를 만든 사례</b> — 신규 브랜드를 인수하지 않고 내부에서 최상위 라인을 만들어 그룹 전체의 격을 올림. 이른바 <b>헤일로(halo) 효과</b></li>
      <li>초기엔 새빌로풍 구조적 테일러링 → 이후 <b>나폴리풍 소프트 숄더</b>로 이동. 영국의 '격식'에서 이탈리아의 '편안한 격식'으로 이동한 남성복 흐름을 그대로 반영</li>
      <li>유통을 <b>의도적으로 제한</b> — 아무 폴로 매장에서나 살 수 없다는 사실 자체가 라인의 지위를 만듦</li>
      <li>⚠️ 그룹 후광의 역효과: <b>"결국 랄프 로렌 아니냐"</b>는 인식 때문에 동급 가격의 이탈리아 정통 테일러 브랜드 대비 저평가받는다는 지적이 꾸준함</li>
    </ul>
  </div>

  <div class="sec prod">
    <h3>④ 상품 구성 — 의류 · 잡화 · 라이프스타일</h3>
    <h4>테일러링 — 라인의 존재 이유</h4>
    <p>나폴리 인근 공방에서 생산되는 소프트 숄더 재킷·수트. 핸드 스티치, 반(半)구조 캔버스 등 공정을 상품 설명에 명시. <b>비스포크·MTM 서비스</b>를 플래그십에서 운영해 최상위 고객을 직접 응대.</p>
    <h4>니트 — 두 번째 축</h4>
    <p>베네토 파인게이지 니트, 캐시미어. 수트를 안 사는 고객이 <b>퍼플라벨을 처음 경험하는 관문</b> 역할. 로로피아나의 로퍼와 같은 위치.</p>
    <h4>셔츠 · 캐주얼 · 아우터</h4>
    <p>드레스 셔츠에서 시작해 최근에는 스웨이드 블루종, 캐시미어 아우터 등 <b>포멀-캐주얼 경계 상품</b>으로 확장. 격식이 완화되는 시장 흐름에 맞춘 조정.</p>
    <h4>잡화</h4>
    <p>슈즈(이탈리아 생산), 레더 굿즈, 넥타이·머플러. <b>넥타이가 브랜드의 원점</b>이라는 서사가 여기서 다시 회수됨. 다만 잡화 자체의 독립적 존재감은 로로피아나보다 약함.</p>
    <h4>라이프스타일 — 그룹 차원에서 해결</h4>
    <p>퍼플라벨 단독 리빙 라인은 없지만, <b>Ralph Lauren Home과 랄프스 커피·레스토랑</b>이 그룹 차원에서 세계관을 완성. 라인이 아니라 <b>그룹이 라이프스타일을 담당하는 구조</b> — 서브 라인이 무리하게 확장하지 않아도 되는 이유.</p>
  </div>

      <p>인기 포인트: 어깨의 부드러움, 원단 등급, 기성복인데 맞춤처럼 떨어지는 실루엣.</p>
      <p class="voice">소비자 반응 — <b>"같은 값이면 이탈리아 정통 브랜드를 사겠다"</b>는 회의론과 <b>"세일 때 사면 이 가격에 이 퀄리티는 없다"</b>는 실용론이 정면 충돌하는 라인. 즉 <b>정가 신뢰가 가장 약한 지점</b>이 브랜드의 약점으로 반복 지적됨. 반대로 원단·봉제 자체에 대한 불만은 드묾 — 품질이 아니라 <b>가격 정당성</b>이 논쟁 대상.</p>

    <h3>⑦ 포터리 레퍼런스 포인트</h3>
    <div class="ref"><div class="tags"><span class="tag fml">포멀</span><span class="tag all">공통</span></div>
      <b>★ 최상위 라인을 만들어 브랜드 전체의 격을 올리기 (헤일로 효과)</b>
      <p>퍼플라벨의 진짜 기여는 매출이 아니라 <b>폴로의 인식 품질을 올린 것</b>. 포터리도 포멀 라인을 낼 때 '비싼 옷 몇 개'가 아니라 <b>명시적으로 최상위 라인</b>으로 설계하면(생산지·공정·유통 제한을 명시), 기존 스탠다드 라인의 인식 가격까지 함께 올라감. 다중 라인 확장의 핵심 논리.</p></div>
    <div class="ref"><div class="tags"><span class="tag all">공통</span></div>
      <b>유통 제한을 제품 사양처럼 쓰기</b>
      <p>"이 라인은 성수 플래그십과 ○○점에서만"이라고 <b>명시적으로 한정</b>하면 그 자체가 라인의 지위를 만듦. 백화점 8개점으로 확장하는 국면에서, 전 매장 동일 구색이 아니라 <b>라인별 취급 매장을 차등</b>하는 전략을 검토할 가치가 있음.</p></div>
    <div class="ref"><div class="tags"><span class="tag fml">포멀</span><span class="tag std">스탠다드</span></div>
      <b>고객이 소득이 올라도 브랜드를 떠나지 않게 하는 3층 구조</b>
      <p>폴로 → RRL/퍼플라벨의 계단은 <b>같은 세계관 안에서 상향 이동</b>을 가능하게 함. 포터리의 4개 라인도 단순 카테고리 분할이 아니라 <b>가격·격식의 계단</b>으로 배치하면, 고객 생애가치가 길어짐.</p></div>
    <div class="ref"><div class="tags"><span class="tag all">공통</span></div>
      <b>VMD — '상점'이 아니라 '누군가의 집'처럼</b>
      <p>랄프 로렌 VMD의 핵심 문법. 집기를 판매 도구가 아니라 <b>생활 가구</b>(책상·책장·러그·액자)로 쓰면 상품이 라이프스타일 안에 놓임. 포터리의 '정돈된 일상'이라는 언어와 매우 잘 맞고, 제임스 펄스의 '집기=상품' 전략과 결합하면 강력함.</p></div>

    <h3>⑦ 포터리 레퍼런스 포인트</h3>
    <div class="ref"><div class="tags"><span class="tag all">공통</span></div>
      <b>★ '여기서만 살 수 있는' 상품을 설계하기</b>
      <p>Purple Label의 희소성은 제약에서 왔지만, <b>포터리는 이걸 의도적으로 만들 수 있음</b>. 성수 플래그십 한정 상품, 매장별 한정 컬러 등. 특히 <b>외국인 매출 30% 목표</b>와 직결 — 여행자에게 "여기서만 살 수 있다"는 것보다 강한 구매 동기는 없음. 랄프 로렌 퍼플라벨의 '유통 제한'과 함께 <b>두 번째로 확인되는 패턴</b>.</p></div>
    <div class="ref"><div class="tags"><span class="tag tech">테크</span></div>
      <b>★ 기능 경쟁을 포기하고 '감성'으로 가는 선택지</b>
      <p>65/35 클로스는 현대 셸보다 기능이 떨어지는데 그게 매력임 — <b>경년변화하는 기능복</b>이라는 포지션. 포터리 테크 라인이 아크테릭스·골드윈과 기능으로 경쟁하는 건 승산이 낮으므로, <b>기능은 충분한 수준으로 두고 소재의 경년변화·질감으로 차별화</b>하는 길이 현실적일 수 있음. 웨어하우스의 페이딩 논리를 테크에 적용하는 것.</p></div>
    <div class="ref"><div class="tags"><span class="tag all">공통</span></div>
      <b>같은 팀·같은 소재로 두 개의 다른 결과물 만들기</b>
      <p>nanamica(감춤)와 Purple Label(드러냄)이 <b>같은 디자이너·같은 소재 풀</b>에서 나옴. 포터리도 라인을 늘릴 때 개발 자원을 늘리는 게 아니라, <b>같은 원단으로 노출 정도만 달리해</b> 두 라인을 만들 수 있음 — 개발 효율이 가장 높은 라인 분리법.</p></div>
    <div class="ref"><div class="tags"><span class="tag all">공통</span></div>
      <b>기존 자산을 재해석하는 저비용 확장</b>
      <p>TNF 아카이브를 원본으로 삼아 새로 개발하지 않음. 포터리도 <b>과거 시즌의 잘 팔린 상품을 소재·컬러만 바꿔 재출시</b>하는 아카이브 재해석 라인을 만들면, 개발비 없이 상품 수와 서사를 동시에 얻음. (RRL·나이젤 카본의 아카이브 논리를 자사 자산에 적용)</p></div>
    <div class="ref"><div class="tags"><span class="tag all">공통</span></div>
      <b>⚠️ 접근 제약은 리셀 시장을 만든다</b>
      <p>Purple Label은 병행·리셀에서 가격과 경험을 전혀 통제하지 못함. 포터리가 한정 상품을 만든다면 <b>리셀 대응(수량 조절, 구매 이력 관리, 재입고 정책)</b>을 함께 설계해야 함 — 노세일 원칙을 지키는 브랜드일수록 리셀 프리미엄이 붙기 쉬움.</p></div>
    <div class="warnbox"><b>⚠️ 주의점 (반면교사)</b><br>
    ① <b>희소성이 제약에서 온 경우 통제할 수 없음</b> — 브랜드가 원해서 만든 게 아니라 라이선스 때문. 의도적으로 설계한 희소성(랄프 로렌 퍼플라벨)과 구분해서 볼 것.<br>
    ② <b>모브랜드 의존은 독자성을 제한함</b> — TNF 로고를 떼면 남는 게 적음. 서브 라인은 언젠가 <b>자기 식별자</b>를 가져야 함.<br>
    ③ <b>지역 한정은 성장을 막음</b> — 국제적 수요가 있어도 팔 수 없음. 희소성과 성장은 대개 양립하지 않는다는 사실.</div>

    <h3>5. 포터리 적용 제안</h3>
    <p class="hint">상품 단위(A~B)와 운영 단위(①~④)로 정리 · <b>르메르가 실제로 답을 갖고 있는 것만</b> 포함</p>

    <h4 style="margin-top:16px">5-1. 상품 단위 — 무엇을 만들 것인가</h4>
    <button class="backtop" data-back="lm-analysis">↑ 4번 대응표로 돌아가기</button>
    <div class="props">

      <div class="prop" id="lm-card-a">
        <div class="hd"><span class="rank">1순위</span><span class="t">카드 A — 가방: 형태 하나를 정하고 패밀리로 키우기</span><span class="coord">Modern × Standard</span></div>
        <div class="bd">
          <dl>
            <dt>포터리 공백</dt><dd>남성 가방 <b>없음</b>. 중장기 과제로 공표만 된 상태 — 이 보드에서 확인된 <b>포터리 최대 공백</b></dd>
            <dt>참조 컬렉션</dt><dd><a href="https://www.lemaire.fr/collections/croissant-bag" target="_blank">Croissant Bag</a> — 단일 형태가 브랜드 식별자<br>
            <a href="https://www.lemaire.fr/collections/fortune-croissant-bag" target="_blank">Fortune Croissant Bag</a> — 같은 형태의 변형<br>
            <a href="https://www.lemaire.fr/collections/molded-bags" target="_blank">Molded</a> · <a href="https://www.lemaire.fr/collections/belted-bags" target="_blank">Belted</a> · <a href="https://www.lemaire.fr/collections/scarf-bags" target="_blank">Scarf</a> · <a href="https://www.lemaire.fr/collections/quiver-bags" target="_blank">Quiver</a> — 형태명 컬렉션</dd>
            <dt>참조 체계</dt><dd>가방을 토트·숄더 같은 <b>일반 명사가 아니라 고유 형태명</b>으로 분류. 하나가 다시 fortune(변형)·filt(협업)·coin purse(축소)로 갈라짐</dd>
          </dl>
          <ol class="take">
            <li><b>첫 상품은 하나만.</b> 크루아상 하나가 612개 상품의 뿌리가 됐음. 포터리도 <b>'컴포트 셔츠'에 해당하는 가방 원형 하나</b>부터. 구색으로 여러 개 내면 지금 액세서리와 같은 결과가 됨.</li>
            <li><b>형태에 이름을 붙인다.</b> 로고 없이 식별되려면 실루엣이 특징적이어야 하고, 그 형태에 이름이 있어야 패밀리로 자랄 수 있음. 포터리는 이미 <b>컴포트·스탠다드 같은 모델명 문화</b>가 있어 그대로 확장 가능.</li>
            <li><b>옷과 같은 명명 규칙을 쓴다.</b> 르메르는 잡화도 <span class="none">[형태]-[성별]-[소재]</span> 규칙이 동일. 포터리도 <span class="none">[소재]+[모델]+[품목]</span>을 가방에 그대로 적용하면 <b>옷-가방이 한 체계</b>로 묶임.</li>
            <li><b>같은 형태를 크기로 늘린다.</b> medium / coin purse처럼 <b>사이즈 변주가 첫 확장</b>. 새 형태를 만드는 것보다 개발 부담이 훨씬 낮음.</li>
          </ol>
          <p class="foot"><b>예상 상품</b> — 노트북+서류 미니멀 토트(원형) → 미니 사이즈 → 셔츠 원단 버전 → 출장 더플 · <b>왜 1순위인가</b> — 포터리 최대 공백이고, 르메르가 <b>매출 50%까지 간 유일한 실증</b>. 다만 개발 난이도는 이 보드 제안 중 가장 높음.</p>
        </div>
      </div>

      <div class="prop" id="lm-card-b">
        <div class="hd"><span class="rank">2순위</span><span class="t">카드 B — 소품을 '완성 부품'으로 넓히기</span><span class="coord">공통</span></div>

          <dl>
            <dt>포터리 현황</dt><dd>벨트·타이는 정가 프리미엄으로 <b>이미 잘 하고 있음</b>. 다만 축이 두 개뿐</dd>
            <dt>참조 컬렉션</dt><dd><a href="https://www.lemaire.fr/collections/women-small-leather-goods" target="_blank">Small Leather Goods</a> · <a href="https://www.lemaire.fr/collections/women-jewellery" target="_blank">Jewellery</a> · <a href="https://www.lemaire.fr/collections/scarf-bags" target="_blank">Scarf Bags</a><br>
            <a href="https://www.lemaire.fr/collections/il-bussetto-for-lemaire" target="_blank">Il Bussetto for Lemaire</a> — 가죽 장인과의 소품 협업</dd>
            <dt>참조 체계</dt><dd>accessories 메뉴가 <b>leather goods / jewellery / belts / textile accessories</b> 4갈래</dd>
          </dl>
          <ol class="take">
            <li><b>가죽 소품(카드홀더·파우치)이 가방보다 먼저다.</b> 개발 난이도가 낮고, 포터리는 이미 <b>이탈리안 레더 벨트</b>로 가죽 소싱 경험이 있음 — 같은 가죽으로 소품을 내는 것이 가방보다 훨씬 빠른 경로.</li>
            <li><b>스카프·머플러 축을 연다.</b> 르메르는 스카프를 가방과 엮어 <span class="none">scarf-bags</span>라는 컬렉션까지 만듦. 포터리는 타이가 있으므로 <b>같은 울 원단으로 머플러</b>가 자연스러운 확장.</li>
            <li><b>장인 협업으로 첫 진입.</b> Il Bussetto처럼 <b>가죽 공방과 협업</b>하면 자체 개발 없이 카테고리를 열 수 있음.</li>
          </ol>
          <p class="foot"><b>예상 상품</b> — 벨트와 같은 가죽의 카드홀더·키홀더 → 울 머플러(타이 원단 공유) → 가죽 공방 협업 파우치 · <b>왜 2순위인가</b> — 가방(카드 A)의 <b>사전 단계</b>로 기능함. 가죽 소싱·품질 기준을 소품에서 검증한 뒤 가방으로 가는 것이 안전.</p>
        </div>

      <div class="prop na" id="lm-card-na">
        <div class="hd"><span class="rank">참조 부적합</span><span class="t">셔츠 · 데님 · 수트 · 니트 · 이너</span><span class="coord">—</span></div>

    <h4 style="margin-top:22px">5-2. 운영 단위 — 어떻게 팔 것인가</h4>

    <div class="ref" id="lm-op1">
      <b>① 메뉴 구조가 곧 사업 구조 선언 ★</b>
      <p>르메르 자사몰 최상위 메뉴는 <b>women · men · bags · shoes · accessories · Objects</b>입니다. 가방이 성별 라인과 <b>같은 층</b>에 있고, 이게 매출 50%라는 사실과 정확히 대응합니다. 포터리 자사몰은 지금 <b>성별 → 품목</b> 아래에 액세서리가 있는데, 잡화를 키우기로 했다면 <b>메뉴에서 먼저 승격</b>시키는 것이 순서입니다. 상품이 늘어난 다음에 메뉴를 바꾸는 게 아니라, <b>메뉴를 바꿔서 상품이 늘어날 자리를 만드는</b> 것.</p></div>

    <div class="ref" id="lm-op2">
      <b>② 잡화도 옷과 같은 명명 규칙으로</b>
      <p>르메르는 옷과 가방이 <b>동일한 상품명 구조</b>를 씁니다(<span class="none">[형태]-[성별]-[소재]-[컬러]-[품번]</span>). 포터리가 가방을 낼 때 <span class="none">[소재]+[모델]+[품목]</span> 규칙을 그대로 적용하면 — 예를 들어 "이탈리안 나파 컴포트 토트" — <b>옷 고객이 가방을 같은 브랜드 문법으로 인식</b>합니다. 잡화가 별개 사업처럼 보이지 않게 하는 가장 값싼 방법.</p></div>

    <div class="ref" id="lm-op3">
      <b>③ 리빙은 '자리부터' 선점 — 상품은 나중</b>
      <p>르메르 <b>Objects</b>는 향 쿠션 몇 개 수준인데도 <b>최상위 메뉴</b>에 있습니다. 제임스 펄스가 가구를 직접 만든 것과 정반대로, <b>소수의 소품으로 카테고리를 선언</b>하고 자리를 먼저 잡아뒀습니다. 포터리도 리빙을 개발하기 전에 <b>도자·공예 소품 서너 개로 메뉴에 자리를 만들어두면</b>, 나중에 확장할 때 고객에게 갑작스럽지 않습니다. 마가렛 호웰의 셀렉트 방식과 결합하면 재고 부담도 거의 없음.</p></div>

    <div class="ref" id="lm-op4">
      <b>④ 협업 상대를 브랜드가 아니라 '장인'으로</b>
      <p>포터리 협업 이력(NB·미래에셋)은 <b>브랜드 대 브랜드</b>입니다. 르메르는 <b>Il Bussetto</b>(가죽 공방)·<b>Carlos Peñafiel</b>(아티스트)처럼 <b>만드는 사람</b>과 협업합니다. 장인 협업은 인지도를 빌려오지는 못하지만 <b>소재·공정 서사를 얻고 새 카테고리를 열 수 있습니다</b> — 포터리가 가방·소품으로 갈 때 국내 가죽 공방과의 협업이 <b>자체 개발과 브랜드 협업 사이의 중간 경로</b>가 됩니다.</p></div>

    <div class="ref">
      <b>⑤ ⚠️ 대중 라인은 양날 — Uniqlo U가 보여주는 것</b>
      <p>두 디렉터가 Uniqlo U를 함께 만들면서 르메르는 세계적 인지도를 얻었지만, <b>"유니클로에서 비슷한 걸 산다"</b>는 잠식도 함께 얻었습니다. 포터리가 하위 라인이나 대중 협업을 검토한다면 <b>디자인 언어는 공유하되 상품이 겹치지 않게</b> 선을 그어야 합니다 — MHL.(마가렛 호웰)이 워크웨어로 장르를 분리한 것이 참고 모델.</p></div>
