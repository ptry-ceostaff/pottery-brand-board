<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>POTTERY 브랜드 레퍼런스 보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f2f0; --card:#ffffff; --ink:#1f1f1f; --sub:#6e6e6e; --line:#dedede;
  --accent:#3a3a3a; --dark:#1a1a1a;
  --row-modern:#37424d; --row-natmod:#3c4a3f; --row-natural:#41503a; --row-vinnat:#453a30; --row-vintage:#3f3128;
  --tint-modern:#eef1f4; --tint-natmod:#edf1ec; --tint-natural:#eef1ea; --tint-vinnat:#f4eee6; --tint-vintage:#f8f1e4;
  --tag-std:#5a5a5a; --tag-cas:#6e6e6e; --tag-fml:#4a4a4a; --tag-tech:#7a7a7a; --tag-all:#8a8a8a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;font-weight:400;background:var(--bg);color:var(--ink);line-height:1.75;-webkit-font-smoothing:antialiased}
.wrap{max-width:1280px;margin:0 auto;padding:36px 28px 80px}
/* ---------- header ---------- */
.hd h1{font-size:30px;letter-spacing:-.5px;font-weight:800}
.hd h1 .logo{color:var(--accent);letter-spacing:1px;font-weight:700}
.hd .sub{color:var(--sub);font-size:14px;margin-top:6px}
.legend{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin:18px 0 26px;font-size:12.5px;color:var(--sub)}
.btn-pottery{margin-left:auto;background:var(--dark);color:#f2f2f0;border:none;padding:9px 18px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-pottery .logo{color:#cccccc}
.btn-pottery:hover{background:#000}
/* ---------- matrix ---------- */
.matrix{display:grid;grid-template-columns:110px repeat(7,1fr);gap:0;overflow:hidden;font-size:13px}
.mx-corner{background:var(--dark);background-image:linear-gradient(to top right,transparent calc(50% - .6px),rgba(255,255,255,.45) calc(50% - .6px),rgba(255,255,255,.45) calc(50% + .6px),transparent calc(50% + .6px));padding:14px 12px}
.mx-corner b{color:#f2f2f0;font-size:13px}
.mx-col{background:var(--dark);color:#f2f2f0;padding:13px 8px;text-align:center;font-weight:700;font-size:13.5px}
.mx-col.bridge{background:#3a3a3a;color:#c8c8c8;font-weight:500;font-size:12px}
.mx-row{color:#f2f2f0;padding:12px 10px;font-weight:700;display:flex;align-items:center;font-size:13px;line-height:1.4}
.mx-cell{background:var(--card);border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 9px;min-height:64px}
.mx-cell.bridge{filter:brightness(.972)}
.chip{display:block;width:100%;text-align:left;background:none;border:none;font-family:inherit;font-size:13px;color:var(--ink);padding:2.5px 4px;cursor:pointer;line-height:1.45}
.chip.todo{cursor:default}
.chip.todo:hover{background:none}
.chip:hover{background:rgba(0,0,0,0.081)}
.chip.has{font-weight:700;color:#1a1a1a}
.chip.has::after{content:"→";color:var(--accent);font-size:11px;margin-left:5px}
.chip.todo{color:#6e6e6e}
/* 주요 브랜드 */
.chip.key{background:rgba(0,0,0,0.07200000000000001);box-shadow:inset 2px 0 0 var(--accent);padding-left:8px}
.chip.key:hover{background:rgba(0,0,0,0.14400000000000002)}
.legend .keybox{display:inline-block;width:11px;height:11px;background:rgba(0,0,0,0.12600000000000003);box-shadow:inset 2px 0 0 var(--accent);margin-right:5px;vertical-align:-1px}
.btn-key{background:none;border:1px solid var(--line);padding:6px 13px;font-size:12.5px;color:var(--sub);cursor:pointer;font-family:inherit}
.btn-key:hover{border-color:var(--accent);color:var(--accent)}
.btn-key.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.matrix.only-key .chip:not(.key){display:none}
.matrix.only-key .mx-cell{min-height:44px}
/* row tint per band */
.r-modern .mx-cell{background:var(--tint-modern)} .r-natmod .mx-cell{background:var(--tint-natmod)}
.r-natural .mx-cell{background:var(--tint-natural)} .r-vinnat .mx-cell{background:var(--tint-vinnat)}
.r-vintage .mx-cell{background:var(--tint-vintage)}
.foot{margin-top:14px;color:var(--sub);font-size:12px}
/* ---------- detail ---------- */
.detail{max-width:880px;margin:0 auto}
.back{background:none;border:1px solid var(--line);padding:8px 16px;font-size:13px;color:var(--sub);cursor:pointer;font-family:inherit;margin-bottom:22px}
.back:hover{border-color:var(--accent);color:var(--accent)}
.d-card{background:var(--card);border:1px solid var(--line);padding:34px 38px;}
.d-head .cellpos{display:inline-block;font-size:12px;font-weight:700;color:#4a4a4a;border:1.5px solid #4a4a4a;padding:3px 12px;margin-bottom:12px}
.d-head h2{font-size:28px;letter-spacing:-.5px}
.d-head .en{color:var(--sub);font-size:14px;margin-left:8px;font-weight:400}
.d-head .oneline{margin-top:12px;font-size:16.5px;font-weight:600;line-height:1.65;color:#333333;border-left:3px solid var(--accent);padding-left:14px}
.sec{margin-top:34px}
.sec>h3{font-size:15px;font-weight:800;color:var(--accent);letter-spacing:.3px;margin-bottom:12px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.sec p{font-size:14.5px;margin:8px 0}
.sec ul{padding-left:19px;font-size:14.5px}
.sec li{margin:5px 0}
table.qf{width:100%;border-collapse:collapse;font-size:13.5px}
table.qf th{width:120px;text-align:left;color:var(--sub);font-weight:600;padding:7px 10px 7px 0;vertical-align:top;border-bottom:1px solid #ededed}
table.qf td{padding:7px 0;border-bottom:1px solid #ededed}
.tl{position:relative;padding-left:18px}
.tl::before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .ev{position:relative;margin:9px 0;font-size:14px}
.tl .ev::before{content:"";position:absolute;left:-17.5px;top:7px;width:7px;height:7px;background:var(--accent)}
.tl .y{font-weight:800;margin-right:8px}
.prod h4{font-size:14px;margin:15px 0 4px;font-weight:700}
.prod h4:first-child{margin-top:0}
.warnbox{background:#f7f7f7;border:1px solid #e2e2e2;padding:13px 16px;font-size:13.5px;margin-top:10px}
/* ---- v4.1: 브랜드 개요 · 선언문 ---- */
.ovw{font-size:14.5px;line-height:1.85;margin:2px 0 0}
.ovw b{color:#1a1a1a}
.manifesto{margin-top:16px;padding:16px 20px;background:#ffffff;border:1px solid var(--line);border-left:3px solid var(--accent);}
.manifesto .h{display:block;font-size:11.5px;font-weight:800;color:var(--accent);letter-spacing:.6px;margin-bottom:8px}
.manifesto blockquote{margin:0;font-size:13.5px;line-height:1.85;color:#454545}
.manifesto blockquote .en{display:block;margin-top:8px;font-size:12.5px;color:#858585;font-style:italic;line-height:1.7}
.manifesto .src{display:block;margin-top:9px;font-size:12px;color:var(--sub)}
.manifesto.none{border-left-color:#c8c8c8;background:#f8f8f8}
.manifesto.none .h{color:#858585}
/* ---- v4: 상품 라인업 × 포터리 대응 비교표 ---- */
.cmpwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:10px 0}
.cmp{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
.cmp th{background:var(--dark);color:#f2f2f0;font-weight:700;text-align:left;padding:10px 12px;font-size:12.5px;white-space:nowrap}
.cmp td{border-bottom:1px solid var(--line);padding:10px 12px;vertical-align:top;line-height:1.5}
.cmp tr:last-child td{border-bottom:none}
.cmp .sig-t{font-weight:800;color:#1a1a1a;cursor:pointer;border-bottom:1px dotted var(--accent)}
.cmp .sig-t::after{content:"▾";color:var(--accent);font-size:10px;margin-left:4px;display:inline-block;transition:transform .18s}
.cmp tr.expanded .sig-t::after{transform:rotate(180deg)}
.cmp tr.sig-row{display:none}
.cmp tr.sig-row.open{display:table-row}
.cmp tr.sig-row td{background:#f7f7f7;font-size:13px;color:#454545}
.cmp tr.sig-row .voice{color:#555555;display:block;margin-top:5px}
.cmp .gap{color:var(--accent);font-weight:700}
.xmark{color:#c0392b;font-weight:800;font-size:17px;line-height:1}
.cmp .none{color:#a3a3a3}
.cmp caption{caption-side:bottom;text-align:left;font-size:12.5px;color:var(--sub);padding-top:8px;line-height:1.6}
/* ---- v4.6: 상품 구성 도식 ---- */
.diag{margin:14px 0}
.diag .cap{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.3px;margin-bottom:7px}
/* 네이밍 공식 */
.formula{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:14px 16px;background:var(--dark);}
.formula .tok{background:#ffffff;color:var(--ink);padding:7px 13px;font-size:13.5px;font-weight:700;line-height:1.35;text-align:center}
.formula .tok small{display:block;font-size:11px;font-weight:500;color:var(--sub);margin-top:2px}
.formula .op{color:#c8c8c8;font-size:13px;font-weight:700}
.formula .tok.a{box-shadow:inset 0 -3px 0 var(--accent)}
.formula .tok.b{box-shadow:inset 0 -3px 0 #4a4a4a}
/* 2축 격자 */
.gridwrap{overflow-x:auto;margin-top:4px}
.mgrid{border-collapse:collapse;font-size:12px;min-width:520px}
.mgrid th{background:#eeeeee;color:#454545;font-weight:700;padding:8px 9px;border:1px solid var(--line);text-align:center;font-size:11.5px;line-height:1.35}
.mgrid th.rowh{background:var(--dark);color:#f2f2f0;text-align:left;white-space:nowrap}
.mgrid th.corner{background:transparent;border:none}
.mgrid td{border:1px solid var(--line);text-align:center;padding:8px 9px;background:var(--card);color:#c4c4c4;font-size:13px}
.mgrid td.on{background:rgba(0,0,0,0.117);color:var(--accent);font-weight:800}
.mgrid .note{font-size:11.5px;color:var(--sub);text-align:left;background:transparent;border:none}
/* 분류축 레인 */
.lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px;margin-top:4px}
.lane{border:1px solid var(--line);overflow:hidden;background:var(--card)}
.lane>.h{background:#eeeeee;padding:8px 11px;font-size:12.5px;font-weight:800;color:#454545;display:flex;gap:6px;align-items:baseline}
.lane>.h .n{color:var(--accent);font-size:13px}
.lane.star>.h{background:var(--accent);color:#fff}
.lane.star>.h .n{color:#ededed}
.lane .b{padding:10px 11px;font-size:12px;line-height:1.65;color:#454545}
.lane .b .step{display:block;padding-left:11px;position:relative;margin-bottom:3px}
.lane .b .step::before{content:"→";position:absolute;left:0;color:var(--accent);font-size:10px;top:2px}
.lane .b .step:first-child::before{content:"·"}
.lane .b em{font-style:normal;color:var(--sub)}
.lane .tag2{display:inline-block;margin-top:7px;font-size:11px;background:#f2f2f2;padding:2px 8px;color:var(--sub)}
/* ---- v4.5: 분석 → 제안 점프 ---- */
.jump{display:inline-block;margin-top:6px;background:none;border:1px solid var(--accent);color:var(--accent);padding:3px 11px;font-size:11.5px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap;line-height:1.5}
.jump:hover{background:var(--accent);color:#fff}
.verdict{font-weight:700;display:block;margin-bottom:2px}
.verdict.ok{color:#4a4a4a}
.verdict.gapv{color:var(--accent)}
.verdict.na{color:#858585}
.prop.flash{animation:flash 1.5s ease}
@keyframes flash{0%{}40%{}100%{}}
.backtop{display:inline-block;margin-top:4px;background:none;border:none;color:var(--sub);font-family:inherit;font-size:12px;cursor:pointer;padding:0;text-decoration:underline}
.backtop:hover{color:var(--accent)}
/* ---- v4.3: 제안 카드 ---- */
.props{display:grid;gap:14px;margin-top:14px}
.prop{border:1px solid var(--line);background:#ffffff;overflow:hidden}
.prop>.hd{background:var(--dark);color:#f2f2f0;padding:11px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.prop>.hd .t{font-size:14.5px;font-weight:800}
.prop>.hd .rank{font-size:11.5px;font-weight:700;background:var(--accent);color:#fff;padding:2px 9px}
.prop>.hd .coord{font-size:11.5px;color:#c8c8c8;margin-left:auto}
.prop .bd{padding:14px 16px}
.prop dl{display:grid;grid-template-columns:96px 1fr;gap:6px 12px;margin:0 0 12px;font-size:13px}
.prop dt{color:var(--sub);font-weight:700}
.prop dd{margin:0;line-height:1.6}
.prop dd a{color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(0,0,0,0.315)}
.prop dd a:hover{border-bottom-style:solid;color:#3a3a3a}
.prop .take{margin:0;padding-left:19px;font-size:13.5px;line-height:1.7}
.prop .take li{margin-bottom:7px}
.prop .take li:last-child{margin-bottom:0}
.prop .foot{margin-top:12px;padding-top:11px;border-top:1px dashed var(--line);font-size:13px;color:#454545;line-height:1.7}
.prop .foot b{color:var(--accent)}
.prop.na>.hd{background:#6e6e6e}
.prop.na>.hd .rank{background:#949494}
@media(max-width:640px){ .prop dl{grid-template-columns:1fr;gap:2px 0} .prop dt{margin-top:6px} }
/* ---- v4: 5축 안의 포터리 적용 블록 ---- */
.pot-apply{margin-top:11px;padding:11px 13px;background:#f7f7f7;border-left:3px solid var(--accent);}
.pot-apply .h{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.3px;display:block;margin-bottom:5px}
.pot-apply p{font-size:13.5px;margin:0;line-height:1.65}
.pot-apply .tags{margin-bottom:5px}
.sig{border:1px solid var(--line);padding:15px 18px;margin:10px 0;background:#ffffff}
.sig b.t{font-size:14.5px}
.sig .price{color:var(--sub);font-weight:400;font-size:13px}
.sig p{font-size:13.5px;margin:5px 0 0}
.sig .voice{color:#555555;font-size:13px;margin-top:6px}
/* strengths accordion */
.acc{border:1px solid var(--line);overflow:hidden}
.acc-item+.acc-item{border-top:1px solid var(--line)}
.acc-btn{display:grid;grid-template-columns:130px 1fr;gap:10px;align-items:center;width:100%;background:#ffffff;border:none;font-family:inherit;text-align:left;padding:13px 16px;font-size:13.5px;cursor:default;pointer-events:none}
.acc-btn .ax{font-weight:800}
.acc-btn .dots{color:var(--accent);letter-spacing:2px;font-size:12px}
.acc-btn .sum{color:var(--sub)}
.acc-btn .arr{display:none}
.acc-item.open .acc-btn .arr{transform:rotate(90deg)}
.acc-body{display:block;padding:6px 18px 16px;background:#f8f8f8;font-size:13.5px}
.acc-item.open .acc-body{display:block}
.acc-body ul{padding-left:18px}
.acc-body li{margin:6px 0}
.hint{font-size:12px;color:var(--sub);margin-bottom:8px}
/* reference points */
.ref{border-left:3px solid var(--line);padding:2px 0 2px 14px;margin:13px 0}
.ref .tags{margin-bottom:3px}
.tag{display:inline-block;font-size:11px;font-weight:700;color:#fff;padding:2px 10px;margin-right:5px}
.tag.std{background:var(--tag-std)} .tag.cas{background:var(--tag-cas)} .tag.fml{background:var(--tag-fml)} .tag.tech{background:var(--tag-tech)} .tag.all{background:var(--tag-all)}
.ref b{font-size:14.5px}
.ref p{font-size:13.5px;margin-top:3px}
.srcs{font-size:12.5px;color:var(--sub);line-height:2}
.srcs a{color:#555555}
.imglinks a{display:inline-block;margin:3px 10px 3px 0;font-size:13.5px;color:#555555}
.todo-note{background:#ffffff;border:1px dashed var(--line);padding:40px;text-align:center;color:var(--sub)}
@media (max-width:900px){
  .matrix{font-size:11.5px;grid-template-columns:78px repeat(7,1fr)}
  .chip{font-size:11.5px}
  .d-card{padding:24px 20px}
  .acc-btn{grid-template-columns:96px 1fr;font-size:12.5px}
}

.pottery-float{position:fixed;top:86px;left:calc(50% + 648px);width:370px;box-sizing:border-box;max-height:calc(100vh - 110px);overflow-y:auto;overflow-x:hidden;background:#fff;border:1px solid var(--line);padding:14px;z-index:50}
.pottery-float table{min-width:0 !important;width:100%;table-layout:fixed}
.pottery-float .cmp th{padding:6px 6px;font-size:11.5px;white-space:normal}
.pottery-float .cmp td{padding:5px 6px;font-size:12px;line-height:1.35}
.pottery-float .cmp th:nth-child(1){width:21%}
.pottery-float .cmp th:nth-child(2){width:45%}
.pottery-float .cmp th:nth-child(3),.pottery-float .cmp th:nth-child(4){width:17%}
.pottery-btn{display:none;position:fixed;right:18px;bottom:20px;z-index:60;background:#1a1a1a;color:#f2f2f0;border:none;padding:12px 20px;font-weight:800;font-size:13px;cursor:pointer;}
@media(max-width:1679px){
.pottery-float{display:none;left:auto;right:16px;top:auto;bottom:78px;width:min(380px,92vw);max-height:68vh}
.pottery-float.open{display:block}
.pottery-btn{display:inline-flex}
}

.heroimgs{columns:3;column-gap:10px;margin:16px 0 4px}
.heroimgs img{width:100%;height:auto;display:block;margin-bottom:10px;border:1px solid var(--line);background:#f0f0f0;break-inside:avoid}
@media(max-width:700px){.heroimgs{columns:2}}

/* ---------- v5: 미니멀 타이포그래피 ---------- */
h1,h2,h3,h4,.mx-col,.mx-row,.acc-btn .ax,.cmp th,.d-head h2,.hd h1{font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif}
.hd h1{font-size:34px;font-weight:600;letter-spacing:-.2px;line-height:1.35}
.wrap{max-width:1180px;padding:64px 32px 120px}
.legend{margin:26px 0 34px}
.btn-key{border:1px solid var(--ink);padding:7px 16px;font-size:12px;color:var(--ink);letter-spacing:.02em}
.btn-key:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn-key.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:500}
/* matrix: 선만 남기는 격식 */
.matrix{border:1px solid var(--ink);font-size:13px}
.mx-col{font-weight:500;font-size:13.5px;letter-spacing:.02em}
.mx-col.bridge{font-weight:400}
.mx-row{font-weight:500;letter-spacing:.02em}
.mx-cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.chip{padding:3px 5px;font-size:13px}
.chip.has{font-weight:500}
.chip.key{background:transparent;box-shadow:inset 2px 0 0 var(--ink);padding-left:9px}
.chip.key:hover{background:rgba(0,0,0,.05)}
/* detail: 종이 같은 여백 */
.detail{max-width:820px}
.back{border:1px solid var(--line);padding:8px 16px;letter-spacing:.02em}
.d-card{background:var(--card);border:1px solid var(--line);padding:56px 60px}
.d-head h2{font-size:32px;font-weight:600;letter-spacing:-.2px}
.d-head .en{font-family:inherit;font-size:15px;font-weight:400;color:var(--sub)}
.d-head .cellpos{border:1px solid var(--sub);color:var(--sub);font-weight:400;font-size:11.5px;letter-spacing:.06em;padding:4px 12px}
.sec{margin-top:52px}
.sec>h3{font-size:17px;font-weight:600;color:var(--ink);letter-spacing:.01em;padding-bottom:10px;margin-bottom:18px;border-bottom:1px solid var(--ink)}
.sec p{font-size:15px;line-height:1.9;margin:14px 0}
.sec li{margin:8px 0;line-height:1.85}
.acc{border:none}
.acc-item+.acc-item{border-top:1px solid var(--line)}
.acc-item:first-child{border-top:1px solid var(--line)}
.acc-btn{background:transparent;padding:18px 2px 8px;font-size:14px}
.acc-btn .ax{font-weight:600;font-size:14.5px}
.acc-btn .dots{color:var(--ink);font-size:11px}
.acc-body{background:transparent;padding:0 2px 18px;font-size:14.5px}
.acc-body ul{padding-left:17px}
.ref{border-left:1px solid var(--ink);padding-left:18px;margin:22px 0}
.ref b{font-weight:700;font-size:15.5px}
.ref p{font-size:14.5px;line-height:1.9;margin-top:6px}
.manifesto{border:none;border-left:1px solid var(--ink);padding:4px 0 4px 18px;background:transparent;margin:22px 0}

<div class="wrap">

<script>
/* ===================== 매트릭스 데이터 ===================== */
const COLS = [
  {k:'formal', t:'Formal'}, {k:'f-s', t:'Formal↔Standard', bridge:true},
  {k:'standard', t:'Standard'}, {k:'s-c', t:'Standard↔Casual', bridge:true},
  {k:'casual', t:'Casual'}, {k:'c-t', t:'Casual↔Tech', bridge:true},
  {k:'tech', t:'Tech / Sports'}
];
const ROWS = [
  {k:'modern', t:'Modern', cls:'r-modern', color:'var(--row-modern)'},
  {k:'natmod', t:'Natural↔Modern', cls:'r-natmod', color:'var(--row-natmod)'},
  {k:'natural', t:'Natural', cls:'r-natural', color:'var(--row-natural)'},
  {k:'vinnat', t:'Vintage↔Natural', cls:'r-vinnat', color:'var(--row-vinnat)'},
  {k:'vintage', t:'Vintage', cls:'r-vintage', color:'var(--row-vintage)'}
];
/* n=이름, id=상세 페이지 보유 시, key=주요 브랜드 */
const CELLS = {
  'modern|formal':[{n:'Theory',id:'theory',key:1},{n:'Jil Sander'}],
  'modern|f-s':[{n:'The Row',id:'the-row',key:1}],
  'modern|standard':[{n:'Studio Nicholson'}],
  'modern|s-c':[{n:'YOKE'},{n:'Lemaire',id:'lemaire',key:1}],
  'modern|casual':[{n:'Comoli'},{n:'Kith'}],
  'modern|c-t':[{n:"Arc'teryx",id:'arcteryx',key:1}],
  'modern|tech':[{n:'Goldwin'},{n:'Portal'}],
  'natmod|standard':[{n:'Our Legacy'},{n:'Auralee',id:'auralee'},{n:'ATON'}],
  'natural|formal':[{n:'Loro Piana',id:'loro-piana',key:1},{n:'Brunello Cucinelli'}],
  'natural|f-s':[{n:'Margaret Howell'}],
  'natural|standard':[{n:'James Perse',id:'james-perse',key:1},{n:'Sunspel'}],
  'natural|s-c':[{n:'Kaptain Sunshine',id:'kaptain-sunshine',key:1},{n:'Danton'}],

  'vintage|f-s':[{n:'Beams Plus'}],
  'vintage|standard':[{n:"Levi's"}],
  'vintage|casual':[{n:'Warehouse',id:'warehouse',key:1},{n:'A PRESSE'},{n:'RRL',id:'rrl',key:1}],
  'vintage|c-t':[{n:'Nigel Cabourn'}]
};
const HOME_CELLS = [];

/* ===================== 렌더링 ===================== */
function buildMatrix(){
  const m = document.getElementById('matrix');
  let h = '<div class="mx-corner"></div>';
  COLS.forEach(c=> h += '<div class="mx-col'+(c.bridge?' bridge':'')+'">'+c.t+'</div>');
  ROWS.forEach(r=>{
    h += '<div class="mx-row '+r.cls+'" style="background:'+r.color+'">'+r.t.replace('↔','↔<br>')+'</div>';
    COLS.forEach(c=>{
      const key = r.k+'|'+c.k;
      const brands = CELLS[key]||[];
      const cls = 'mx-cell '+r.cls+(c.bridge?' bridge':'')+(HOME_CELLS.includes(key)?' home':'');
      let inner = brands.map(b=>{
        const has = !!b.id;
        if(!has) return '<span class="chip todo'+(b.key?' key':'')+'">'+b.n+'</span>';
        return '<button class="chip has'+(b.key?' key':'')+'" onclick="openBrand(\''+b.id+'\')">'+b.n+'</button>';
      }).join('');
      h += '<div class="'+cls+'">'+inner+'</div>';
    });
  });
  m.innerHTML = h;
}
function toggleKey(){
  const m = document.getElementById('matrix');
  const b = document.getElementById('btn-key');
  const on = m.classList.toggle('only-key');
  b.classList.toggle('on', on);
  b.textContent = on ? '전체 브랜드 보기' : '주요 브랜드만 보기';
}

function toggleMaster(){
  const w=document.getElementById('masterwrap'), f=document.getElementById('masterframe'), b=document.getElementById('btn-master');
  const on = w.style.display==='none';
  if(on && !f.firstChild){
    const i=document.createElement('iframe');
    i.setAttribute('allowfullscreen','');
    i.src='https://embed.figma.com/design/jiJZ9wZIcTiGcYVjANlUuV/POTTERY-MASTER-PRODUCT?node-id=13436-2&embed-host=share&footer=false&theme=light';
    f.appendChild(i);
  }
  w.style.display = on ? 'block' : 'none';
  b.textContent = on ? '전체 상품 마스터 보드 접기' : '전체 상품 마스터 보드 펼치기';
  if(on) w.scrollIntoView({behavior:'smooth',block:'start'});
}

function openBrand(id){
  const d = DETAILS[id];
  const body = document.getElementById('detail-body');
  body.innerHTML = d ? d : '<div class="todo-note">이 브랜드의 상세 분석은 준비 중입니다.</div>';
  document.getElementById('view-board').style.display='none';
  document.getElementById('view-detail').style.display='block';
  location.hash = 'brand='+id;
  window.scrollTo(0,0);
}
function goBoard(){
  document.getElementById('view-detail').style.display='none';
  document.getElementById('view-board').style.display='block';
  location.hash='';
  window.scrollTo(0,0);
}
/* 강점 분석 아코디언 */
document.addEventListener('click', e=>{
  const btn = e.target.closest('.acc-btn');
  if(btn){ return; }
  /* 분석표 → 제안 카드 점프 */
  const jp = e.target.closest('.jump');
  if(jp){
    const el = document.getElementById(jp.dataset.jump);
    if(el){
      el.scrollIntoView({behavior:'smooth', block:'center'});
      el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
    }
    return;
  }
  /* 제안 카드 → 분석표로 복귀 */
  const bt = e.target.closest('.backtop');
  if(bt){
    const el = document.getElementById(bt.dataset.back);
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
    return;
  }
  /* 비교표의 시그니처 상품 클릭 → 다음 행(설명) 토글 */
  const sig = e.target.closest('.sig-t');
  if(sig){
    const row = sig.closest('tr');
    const next = row.nextElementSibling;
    if(next && next.classList.contains('sig-row')){
      const open = next.classList.toggle('open');
      row.classList.toggle('expanded', open);
    }
  }
});
/* 해시 라우팅 (URL 공유 가능) */
document.addEventListener('click', e=>{
  const b=e.target.closest('.pottery-btn');
  if(b){ const p=b.previousElementSibling; if(p&&p.classList.contains('pottery-float')) p.classList.toggle('open'); }
});
function route(){
  const m = location.hash.match(/brand=([a-z-]+)/);
  if(m && DETAILS[m[1]]) openBrand(m[1]);
}

    <p class="ovw" style="margin-top:10px">자사몰은 이 두 집을 각각 컬렉션으로 만들어 판다. Brandílera Collection에는 그 집에 실제 놓인 티크 데이베드와 테이블(Punta Mita Daybed, Punta Mita Tables), 티크 체스 세트, 황마 러너와 바구니, 브러시드 저지 침구가 리넨 드레스, 보드쇼츠, 포플린 반팔 셔츠, 나일론 토트, 모자와 한 묶음으로 올라와 있다. Grey Cape Collection도 같은 식으로 티크 체어(Cabo Chair, Colony Chair), 롱보드, 리넨 베개와 코튼 이불, 목욕 타월에 슬럽 저지 티, 리넨 셔츠와 팬츠, 캐시미어 가디건, 스웨이드 슬라이드와 토트, 야구모자까지 묶여 있다. 즉 별장 하나가 그 집에서 입는 옷, 그 집에 놓인 가구, 그 집에서 쓰는 침구와 수건으로 통째로 상품화돼 있고, 손님은 묵고 나서 그 집을 부분적으로 사 갈 수 있다. 집이 쇼룸이고 컬렉션이 기념품인 구조다.</p>

    <p>브랜드 철학은 대표 원단인 Banner Denim 하나에 다 담겨 있다. 1930년대 리바이스 광고용 배너를 실제로 해체해 원사 단위로 분석하고, 40년대 리바이스의 워싱과 페이딩이 그대로 나오도록 역설계한 원단이다. 복원하려는 대상이 원단의 색이 아니라 시간이 지난 뒤의 모습인 셈이다. 티셔츠도 옆솔기 없는 튜블라 몸판을 구형 편기로 짜는데, 이렇게 원단만이 아니라 기계까지 복각 대상에 들어간다. 확장은 Duck Digger, Heller's Café, Dubbleworks 같은 서브 라인으로 복각하는 시대와 장르를 늘리는 방식인데, 그 대신 대중 인지도는 사실상 없다. 깊이와 규모를 맞바꾼 전형적인 사례라고 할 수 있다.</p>

  <div class="sec">
    <h3>① 브랜드 개요</h3>
    <p>랄프로렌 퍼플라벨은 1994년 신설된 랄프 로렌의 하이엔드 라인으로 라벨 체계를 완성했다. 옷 디자인은 현재는 초기의 새빌로풍에서 나폴리풍 소프트 숄더로 옮겨왔고 생산도 이탈리아로 집중했다. 브랜드 인수 없이 내부 최상위 라인으로 그룹의 격을 올린 헤일로(halo) 효과의 대표 성공 사례이며, 올드 머니 트렌드로 다시 조명받았다. 미국 상류층 이미지를 구현해서 클래식한 정장 스타일을 지키고, 역시나 로고플레이도 하지 않는다.</p>
    <table class="qf">
      <tr><th>론칭</th><td>1994년. 랄프로렌의 럭셔리 라인으로 자리매김하였다</td></tr>
      <tr><th>주력</th><td>테일러링, 파인게이지 니트, 드레스 셔츠</td></tr>
      <tr><th>가격대</th><td>수트 $3,000~8,000, 비스포크 $10,000+, 니트 $700~2,000</td></tr>
      <tr><th>생산</th><td>대부분 Made in Italy. 수트는 나폴리 인근, 니트는 베네토</td></tr>
    </table>
  </div>

  <div class="sec">
    <h3>② 자사몰 상품 구성 체계</h3>
      <p>테일러링이 이 라인의 존재 이유에 해당하는 핵심이라고 할 수 있다. 나폴리 공방의 소프트 숄더 수트가 중심으로 공정을 상품 설명에 명시하고, 비스포크와 MTM은 플래그십에서만 운영해 서열을 시각화한다. 다만 가격대 때문에 접근이 어려운 탓에, 입문템은 니트라고 흔히 이야기한다. 베네토의 파인게이지와 캐시미어로 구성된다. 이후 셔츠나 아우터로 확장하고, 잡화 또한 슈즈, 레더, 넥타이 정도가 있어서 큰 비중은 아니다.</p>

    <p class="ovw">1997년 뉴욕에서 앤드루 로젠과 엘리 타하리가 창업했다. 당시 늘어나던 직장인 여성을 위한 워크웨어 브랜드로 출발해, 핵심은 디자인이 아니라 소재였다. 정장 원단에 라이크라를 넣은 여성 스트레치 팬츠가 첫 상품이었고, 브랜드명도 "Stretch Theory"에서 한 단어를 뺀 것이다. '정장인데 편하다'를 30년간 반복해 '모던 워크웨어'의 대표가 됐고, '컨템포러리'라는 개념을 시작한 브랜드이기도 하다. 포터리가 지향하는 현대 직장인의 출근룩과 유니폼 스타일을 선도해왔다. 2004년 패스트리테일링(유니클로 모기업)에 인수되었다. 한국에서는 백화점 중심으로 유통돼 포터리 포멀 라인의 실질적인 경쟁자라고 할 수도 있다.</p>

    <div class="manifesto">
      <blockquote>"자신만의 길을 개척하고자 하는 모든 분들을 위해, 저희는 일상 속에서도 자신감을 불어넣어 줄 옷을 만들어 여러분이 당당하게 자신의 존재감을 드러낼 수 있도록 돕고자 합니다."</blockquote>
    </div>

    <h3>② 자사몰 상품 구성 체계</h3>
    <p class="ovw">자사몰 분석 결과, 상품 구성은 3개의 축에 의해 짜여 있다. 품목 카테고리가 기본 층을 이루고, 그 위에 원단과 시즌 숍(cashmere-shop, linen-shop, 기능 원단 "In Motion" 등)이 있으며, 가이드와 큐레이션이 이를 뒷받침한다. 상품명이 '모델명 in 원단명' 공식으로 통일돼 있다(Precise Tee in Luxe Cotton Jersey가 그 예시이다). 한 모델이 원단만 바꿔서 출시되는 상품도 많다.</p>
    <p class="ovw" style="margin-top:10px">또한, 'Theory Wardrobe'와 같은 시스템을 운영 중이다. 이는 대표 스타일을 "our dress shirt: the Sylvain"처럼 문장으로 소개하는 상설 페이지로, 유행을 타지 않고 언제든 입을 수 있는 재킷, 셔츠, 팬츠, 니트 등의 핵심 클래식 라인을 하나의 묶음으로 만들어둔 것이다. 즉, '현대인의 유니폼'이라는 철학을 분류로 옮긴 장치라고 할 수 있다. Essential Trios는 같은 모델과 원단을 컬러만 달리해 3장 묶어 판매하는 전략으로, 노세일을 표방하면서 실질적으로는 약 23% 할인을 준다. 추가적으로, Fit guide / Pant guide로 각 카테고리별(팬츠, 블레이저와 자켓, 티셔츠와 폴로, 스웨터)로 핏을 3개 분류 기준으로 나누고, 이 핏에 따른 스테디셀러를 추천하는 등의 서비스도 제공한다.</p>

    <h3>④ 강점 분석</h3>
    <div class="acc">

      <div class="acc-item"><button class="acc-btn"><span class="ax">원단/소재</span><span class="dots">●●●●○</span><span class="arr">▶</span></button>
        <div class="acc-body"><ul>
          <li>원단에 스트레치 원단과 라이크라를 최초로 통합하여, 활동성이 좋으면서도 직장생활에 적합한 고급스러움은 유지가 되는 원단으로 바지를 만들기 시작하였다. 브랜드명 자체가 원단에서 나왔다(Stretch Theory).</li>
          <li>다만 이전과 달리 소재의 희소성이나 독점성이 현재까지 이어지지는 않는다. 이전처럼 소재에 혁신을 만드는 것 또한 아니다. 또한, 원단 스펙 표기는 포터리가 오히려 상세하다.</li>
        </ul></div>
      </div>

      <div class="acc-item"><button class="acc-btn"><span class="ax">디자인</span><span class="dots">●●●○○</span><span class="arr">▶</span></button>
        <div class="acc-body"><ul>
          <li>로고리스에 뉴트럴 팔레트를 쓴다. 신축성으로 밑위를 짧게 만든 캐주얼 팬츠가 초기 혁신이었으나 이후 정체됐고, 그룹의 "핵심 상품이 모멘텀을 잃었다"는 평가 이후에 외부 스타 디자이너 오센드리버를 영입해 Theory Project를 전개하였다.</li>
          <li>'정장인데 편하다'는 포터리의 '정돈된 편안함'과 같은 언어라고 할 수 있다.</li>
        </ul></div>
      </div>

      <div class="acc-item"><button class="acc-btn"><span class="ax">상품구성</span><span class="dots">●●●●○</span><span class="arr">▶</span></button>
        <div class="acc-body"><ul>
          <li>셔츠, 팬츠, 재킷, 니트의 볼륨 균형이 좋고, 직장인들이 회사에 입을만한 옷들을 카테고리별로 빼놓지 않고 판매하여 빈틈없는 구성이다.</li>
          <li>다만 잡화(백 0)와 라이프스타일(0)은 거의 없다.</li>

    <p>1977년 마이클 드레익이 이스트 런던(스피탈필즈 인근)에서 창업했다. 실크 스카프와 숄에서 출발해 수제 넥타이로 명성을 얻은 뒤 옷으로 올라온, 클래식의 정수로 인정받는 브랜드다.</p>

      <tr><th>가격대</th><td>타이 £120~180, 셔츠 £150~250, 재킷 £600~1,200</td></tr>

          <li>서울 매장이 신세계 강남 7층에 있다. 해외 첫 직영을 로드샵이 아니라 백화점 안에 냈는데, 백화점을 넓히는 지금의 포터리 상황과 겹친다</li>
          <li>일본에서는 도매가 주력이다. 공식 취급점 목록에 전국 190곳 이상이 올라 있고, 유나이티드 애로우즈, 저널 스탠다드, Bshop, 스티븐 알란 같은 큰 편집샵 체인이 중심이다</li>
          <li>해외 취급점은 목록을 공개하지 않고 문의로만 알려준다. 넓게 팔되 어디서 파는지는 관리하는 방식이다</li>
        </ul></div>
      </div>

  <div class="sec">
    <h3>⑤ 포터리 적용 제안</h3>
    <div class="ref"><b>도매로 키우고 백화점으로 나가기</b>
      <p>캡틴선샤인은 자사몰 없이 일본 190여 개 편집샵 도매로 규모를 만든 뒤, 해외 첫 직영을 서울 신세계 강남 7층에 냈다. 로드샵이 아니라 백화점을 택했고, 온라인 스토어는 2026년에야 열었다. 자사몰 70%로 시작해 백화점으로 넓히는 포터리와 정확히 반대 순서인데, 그래서 백화점 매장이 브랜드 인지도를 어떻게 만드는지를 거꾸로 보여주는 사례다. 같은 층에서 실물을 확인할 수 있다는 점도 실사 대상으로서 이점이다.</p></div>
    <div class="ref"><b>잡화는 개발이 아니라 '연결'로, 소싱과 편집 역량이 핵심</b>
      <p>소재 중심 브랜드 중에서 유일하게 잡화를 갖고 있는 이유는, 창업자가 카테고리를 가리지 않고 산지를 아는 사람이기 때문이다. 포터리가 잡화를 넓히려면 안에서 개발하기보다 카테고리별로 잘 만드는 곳을 찾아 연결하는 능력이 필요하다. 지금 필요한 사람이 디자이너가 아니라 소싱과 편집 담당일 수 있다는 뜻이다.</p></div>
    <div class="ref"><b>네츄럴 라인의 방향: 고증하지 않고 정서만 가져오기</b>
      <p>캡틴선샤인은 빈티지 옷의 형태만 빌리고 비례를 요즘 몸에 맞게 바꿔서 평소에 입을 수 있게 만들었다. 포터리가 네츄럴 라인을 만들며 캐주얼과 빈티지 요소를 들여온다면, 고증하는 쪽보다 분위기만 가져오는 쪽이 '정돈된 편안함'과 부딪히지 않는다. 자연 소재에 실용적인 원형, 현대적인 비례라는 조합이라 테크와 네츄럴을 잇는 참고 사례로도 가깝다.</p></div>
    <div class="ref"><b>편집자적 시즌 구성: 시즌을 상품 목록이 아니라 주제로</b>
      <p>잡지처럼 시즌마다 주제를 먼저 정하고 아이템을 배열하면 콘텐츠와 매장 진열, 온라인이 저절로 같은 방향을 보게 된다. 산지와 장인 이야기가 그대로 콘텐츠가 되는 것도 포터리가 소재를 설명하는 방식과 비슷하다. 마케팅을 광고가 아니라 편집으로 하는 방법이다.</p></div>
